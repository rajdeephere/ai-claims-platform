# Render Blueprint: the API as a free Docker web service (ADR-0007, docs/deployment.md).
# Secrets are declared with sync: false, so Render asks for them when the Blueprint is created; they
# never live in this file.
services:
  - type: web
    name: ai-claims-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Supabase: Project settings -> Database -> Connection pooling (session mode, port 5432)
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # the Vercel URL, e.g. https://ai-claims.vercel.app (comma-separated for several)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # this service's own URL, e.g. https://ai-claims-api.onrender.com (OpenAPI server URL)
      - key: API_PUBLIC_URL
        sync: false
      # Supabase: Storage -> S3 connection
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_BUCKET
        value: aiclaims-documents
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      # stub (default, no key) or groq
      - key: AI_PROVIDER
        value: stub
      - key: GROQ_API_KEY
        sync: false
