# Shared settings. Profiles: local (default, docker-compose), prod (Render + Supabase), test (Testcontainers).
# Every environment-specific value comes from an environment variable, so the same image runs everywhere.
spring:
  application:
    name: ai-claims-platform
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Supabase free tier and 512 MB on Render: keep the pool small
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema (ADR-0003)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # db/demo holds the demo users; a real deployment would drop it with FLYWAY_LOCATIONS
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}
  task:
    scheduling:
      pool:
        size: 2                   # job runner and outbox relay poll independently
      shutdown:
        await-termination: true   # let a running job finish on shutdown (its lease covers a hard kill)
        await-termination-period: 20s
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${PORT:8081}              # Render injects PORT
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  api:
    version: 1.5.0   # minor: phase 6 added financials and approval endpoints (non-breaking, ADR-0008)
    server-url: ${API_PUBLIC_URL:http://localhost:8081}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ai-claims-platform
      access-token-ttl: 15m
      refresh-token-ttl: 7d
    # brute-force protection: only FAILED logins count
    login-limit:
      failures-per-user-per-minute: 5
      failures-per-ip-per-minute: 30

  # Background work (ADR-0016, 0017). Everything is in the database: nothing is lost on restart or sleep.
  jobs:
    enabled: true
    poll-interval-ms: 2000
    batch-size: 5
    lease: 5m
    max-attempts: 5
    backoff: 30s, 2m, 10m, 1h
  outbox:
    enabled: true
    poll-interval-ms: 2000
    batch-size: 20
    max-attempts: 10
    retry-delay: 1m
  housekeeping:
    cron: "0 17 * * * *"          # hourly, at minute 17
    idempotency-retention: 24h
    finished-work-retention: 7d
  # Object storage for documents (ADR-0019): any S3-compatible store
  storage:
    endpoint: ${STORAGE_ENDPOINT}
    presign-endpoint: ${STORAGE_PRESIGN_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:aiclaims-documents}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    create-bucket: false
    upload-url-ttl: 5m
    download-url-ttl: 5m
  documents:
    abandoned-after: 24h           # PENDING_UPLOAD rows (and objects) older than this are removed
    sweep-cron: "0 23 * * * *"
  intake:
    # if the assessment (AI) hasn't finished by then, the claim moves on without it
    assessment-timeout: 10m
    # triage waits this long after the policy check: the FNOL form uploads its documents meanwhile
    document-grace: 2m
    # while documents are still being assessed, triage checks again this often
    assessment-recheck: 15s
  # AI document assessment (ADR-0021). provider: stub (default, no key needed) or groq
  ai:
    provider: ${AI_PROVIDER:stub}
    prompt-version: v1
    max-document-chars: 12000
    requests-per-minute: 25        # Groq's free tier allows 30; stay below it
    groq:
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY:}
      # checked against Groq's live model list on 2026-09-29; models get retired, so re-check (BUG-008)
      text-model: ${GROQ_TEXT_MODEL:openai/gpt-oss-120b}     # text only
      vision-model: ${GROQ_VISION_MODEL:qwen/qwen3.8-27b}    # text + images, JSON mode
      timeout: 20s

  # Triage thresholds (TriageRules): business settings, changeable per environment
  triage:
    fast-track-max-estimate: 2000.00
    fast-track-max-fraud-score: 20
    complex-min-estimate: 25000.00
    siu-referral-score: 70

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls-primary-name: v1

logging:
  pattern:
    # correlation ID on every line
    level: "%5p [%X{correlationId:-}]"
