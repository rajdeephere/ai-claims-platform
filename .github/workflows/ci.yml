# push -> build + unit tests -> integration tests (Testcontainers) + contract check + coverage -> Docker image
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest   # has Docker, which Testcontainers needs
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build + unit tests
        run: mvn -B -ntp test

      - name: Integration tests + OpenAPI contract check + coverage
        run: mvn -B -ntp verify -Dskip.unit=true

      - name: Test summary
        if: always()
        run: |
          count() { cat $1/TEST-*.xml 2>/dev/null | grep -o '<testsuite [^>]*tests="[0-9]*"' | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}'; }
          {
            echo "### Test results"
            echo "| Unit | Integration |"
            echo "|---|---|"
            echo "| $(count target/surefire-reports) | $(count target/failsafe-reports) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/target/site/jacoco/
          retention-days: 7

  docker:
    name: Docker image
    needs: backend   # only build an image from code that passed every test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: ai-claims-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
