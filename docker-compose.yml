# Local infrastructure. Start with: docker compose up -d --wait
services:
  postgres:
    image: postgres:16-alpine
    container_name: aiclaims-postgres
    environment:
      POSTGRES_DB: aiclaims
      POSTGRES_USER: aiclaims
      POSTGRES_PASSWORD: aiclaims
    ports:
      - "5434:5432"   # 5432 = local Postgres install, 5433 = ClaimFlow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiclaims -d aiclaims"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
